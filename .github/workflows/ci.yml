name: CI/CD Pipeline
on:
  push:
    branches: [main, dev, staging, 11]
  pull_request:
    branches: [main, dev, staging, 11]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Run application tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (no-editable, from pyproject.toml .[dev])
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run pytest unit tests
        run: |
          export PYTHONPATH=.
          python -m pytest APP/test_app.py -v --cov=APP --cov-report=xml --junitxml=report-app.xml

      - name: Upload pytest test report (always run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit-report
          path: report-app.xml
          retention-days: 7

  docker-build-verify:
    name: Docker Build Verify (PR only)
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify docker build success
        run: docker build -t road-surface-check:${{ github.sha }} .

  build-staging:
    name: Build Staging Image
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate staging .env from GitHub secrets
        run: |
          cat > .env.staging << EOF
          MODEL_PATH=${{ secrets.STAGING_MODEL_PATH }}
          MLFLOW_TRACKING_URI=${{ secrets.STAGING_MLFLOW_URI }}
          EOF

      - name: Login docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & push staging image
        run: |
          docker build -t road-surface-classifier:staging-${{ github.sha }} .
          docker push road-surface-classifier:staging-${{ github.sha }}

  build-prod:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate production .env from GitHub secrets
        run: |
          cat > .env.prod << EOF
          MODEL_PATH=${{ secrets.PROD_MODEL_PATH }}
          MLFLOW_TRACKING_URI=${{ secrets.PROD_MLFLOW_URI }}
          EOF

      - name: Login docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & push production image
        run: |
          docker build -t road-surface-classifier:prod-${{ github.sha }} .
          docker push road-surface-classifier:prod-${{ github.sha }}
