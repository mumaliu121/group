name: CI/CD Pipeline
on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest app/test_app.py -v --cov=app --cov-report=xml

  docker-build-verify:
    name: Docker Build Verify (PR only)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # 仅Pull Request执行：只做构建校验，不推送镜像
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify docker build success
        run: docker build -t road-surface-check:${{ github.sha }} .

  build-staging:
    name: Build Staging Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Generate staging .env from secrets
        run: |
          cat > .env.staging << EOF
          MODEL_PATH=${{ secrets.STAGING_MODEL_PATH }}
          MLFLOW_TRACKING_URI=${{ secrets.STAGING_MLFLOW_URI }}
          EOF
      - name: Login docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & push staging image
        run: |
          docker build -t road-surface-classifier:staging-${{ github.sha }} .
          docker push road-surface-classifier:staging-${{ github.sha }}

  build-prod:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Generate production .env from secrets
        run: |
          cat > .env.prod << EOF
          MODEL_PATH=${{ secrets.PROD_MODEL_PATH }}
          MLFLOW_TRACKING_URI=${{ secrets.PROD_MLFLOW_URI }}
          EOF
      - name: Login docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & push production image
        run: |
          docker build -t road-surface-classifier:prod-${{ github.sha }} .
          docker push road-surface-classifier:prod-${{ github.sha }}
